<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Projection Model</title>
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#0b0b0d">
<meta name="robots" content="noindex">
<style>
:root {
  color-scheme: dark;
  --plane:          #0b0b0d;
  --surface-1:      #16161a;
  --surface-2:      #1d1d22;
  --surface-3:      #24242b;
  --text-primary:   #f5f5f2;
  --text-secondary: #a9a8a1;
  --text-muted:     #78776f;
  --hairline:       rgba(255,255,255,0.08);
  --gold:           #ffd966;
  --gold-dim:       #b99a35;
  --gold-glow:      rgba(255,217,102,0.14);
  --bad:            #ff8f8f;
  --r-lg: 16px;
  --r-md: 11px;
  --r-sm: 7px;
  --shadow-card: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --ease: cubic-bezier(.22,.61,.36,1);
  --font: Inter, Poppins, "Segoe UI Variable Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background:
    radial-gradient(1200px 600px at 12% -8%, rgba(255,217,102,.05), transparent 60%),
    radial-gradient(900px 500px at 92% 0%, rgba(57,135,229,.06), transparent 55%),
    var(--plane);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}

.card {
  width: 100%; max-width: 340px;
  background: linear-gradient(180deg, var(--surface-2), var(--surface-1));
  border: 1px solid var(--hairline);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
  padding: 28px 26px 26px;
  animation: rise .32s var(--ease);
}
@keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }

.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.brand-mark {
  width: 38px; height: 38px; flex: none; border-radius: 10px;
  background: linear-gradient(145deg, var(--gold), #8f7526);
  display: grid; place-items: center;
  color: #221c05; font-weight: 800; font-size: 16px; letter-spacing: -.5px;
  box-shadow: 0 0 0 1px rgba(255,217,102,.35), 0 4px 14px -4px rgba(255,217,102,.45);
}
.brand-text h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.2px; }
.brand-text p  { margin: 1px 0 0; font-size: 11.5px; color: var(--text-muted); letter-spacing: .02em; }

form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.input {
  background: var(--plane);
  border: 1px solid var(--hairline);
  color: var(--text-primary);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  font: inherit; font-size: 14px;
  transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
}
.input:hover { border-color: rgba(255,255,255,.18); }
.input:focus {
  outline: none; border-color: var(--gold-dim);
  box-shadow: 0 0 0 3px var(--gold-glow);
  background: #08080a;
}

.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 16px; border-radius: var(--r-sm);
  border: 1px solid transparent;
  font: inherit; font-size: 14px; font-weight: 650;
  cursor: pointer;
  background: linear-gradient(180deg, var(--gold), #e0bb4c);
  color: #201a04;
  box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 6px 18px -8px rgba(255,217,102,.6);
  transition: transform .14s var(--ease), box-shadow .18s var(--ease), opacity .18s;
  margin-top: 4px;
}
.btn-primary:hover { box-shadow: 0 1px 0 rgba(255,255,255,.3) inset, 0 10px 26px -8px rgba(255,217,102,.75); }
.btn-primary:active { transform: translateY(1px) scale(.995); }
.btn-primary[disabled] { opacity: .55; cursor: not-allowed; transform: none; }

.spinner {
  width: 14px; height: 14px; flex: none;
  border: 2px solid rgba(32,26,4,.3); border-top-color: #201a04;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: none;
}
.is-busy .spinner { display: block; }
.is-busy .btn-label { opacity: .85; }
@keyframes spin { to { transform: rotate(360deg); } }

.error {
  display: none;
  align-items: center; gap: 8px;
  font-size: 12.5px; color: var(--bad);
  background: rgba(255,143,143,.1);
  border: 1px solid rgba(255,143,143,.25);
  border-radius: var(--r-sm);
  padding: 8px 10px;
}
.error.show { display: flex; }
.error svg { flex: none; }

.foot { margin-top: 18px; text-align: center; font-size: 11.5px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-mark">FP</div>
    <div class="brand-text">
      <h1>Projection Model</h1>
      <p>Scenario terminal · sign in to continue</p>
    </div>
  </div>

  <form id="loginForm" autocomplete="on">
    <div class="error" id="loginError">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8 4.6v4.2M8 11.2v.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span id="loginErrorText">Incorrect username or password.</span>
    </div>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" class="input" type="text" autocomplete="username"
             autocapitalize="off" spellcheck="false" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" class="input" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-primary" id="loginBtn">
      <span class="spinner"></span>
      <span class="btn-label">Sign in</span>
    </button>
  </form>

  <div class="foot">Projection Model · private dashboard</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const nextUrl = params.get("next") && params.get("next").startsWith("/") ? params.get("next") : "/";

const form = document.getElementById("loginForm");
const btn = document.getElementById("loginBtn");
const errBox = document.getElementById("loginError");
const errText = document.getElementById("loginErrorText");

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  errBox.classList.remove("show");
  btn.disabled = true;
  btn.classList.add("is-busy");
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.ok) {
      errText.textContent = j.error || "Incorrect username or password.";
      errBox.classList.add("show");
      btn.disabled = false;
      btn.classList.remove("is-busy");
      document.getElementById("password").select();
      return;
    }
    location.href = nextUrl;
  } catch {
    errText.textContent = "Couldn't reach the server — try again.";
    errBox.classList.add("show");
    btn.disabled = false;
    btn.classList.remove("is-busy");
  }
});
</script>

</body>
</html>
